[package]
name = "bili-planner"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
description = "Bilibili & Jellyfin 合集观看计划生成器（跨平台桌面应用，Rust + GPUI）"
authors = ["anonymous"]
license = "MIT"
readme = "README.md"
keywords = ["bilibili", "jellyfin", "planner", "gui", "gpui"]
categories = ["multimedia::video"]

[lib]
name = "bili_planner"
path = "src/lib.rs"

[[bin]]
name = "bili-planner"
path = "src/main.rs"

[dependencies]
gpui = "0.2"
gpui-component = "0.5"
gpui-component-assets = "0.5"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
pollster = "0.4"
rust-embed = "8"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }

[package.metadata.packager]
# cargo-packager 配置（https://docs.crabnebula.dev/packager/）
product-name = "bili-planner"
identifier = "com.example.bili-planner"
version = "0.2.0"
description = "Bilibili & Jellyfin 合集观看计划生成器"
long-description = "输入 B 站或 Jellyfin 的合集链接，识别分栏 / 分 P / 季 / 子合集结构，按目标天数生成每日观看计划，可导出为 UTF-8 文本。"
authors = ["anonymous"]
category = "Video"
copyright = "MIT"
license-file = "LICENSE"
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/256x256.png",
  "icons/icon.ico",
  "icons/icon.icns",
]
formats = ["wix", "app", "dmg"]
before-packaging-command = "cargo build --release"
